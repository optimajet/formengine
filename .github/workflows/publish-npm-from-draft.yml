# Publish react-form-builder-*.tgz from the draft GitHub Release on this repo to npm via OIDC.
# Canonical copy: formengine-tools/scripts/release/publish-npm-from-draft.yml
# Compose seeds it onto optimajet/formengine as .github/workflows/publish-npm-from-draft.yml.
# TeamCity dispatches it there (Trusted publisher: org=optimajet repo=formengine).
# See scripts/release/npm-trusted-publishing.md

name: Publish npm from draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Draft release tag (lerna version, e.g. 11.0.0)
        required: true
        type: string
      npm_tag:
        description: npm dist-tag
        required: false
        default: latest
        type: string

permissions:
  # write required so GITHUB_TOKEN can list draft releases (API omits drafts for read-only)
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish draft tarballs to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Do not set registry-url / NODE_AUTH_TOKEN — that disables OIDC trusted publishing.

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Download draft npm archives and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NPM_PUBLISH_TAG: ${{ inputs.npm_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/release/publish-npm-from-draft.sh
