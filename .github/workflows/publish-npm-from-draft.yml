# Publish react-form-builder-*.tgz from the draft GitHub Release on this repo to npm via OIDC.
# Lives on optimajet/formengine (seed via mirror compose). TeamCity dispatches it.
#
# Trusted publisher: org=optimajet repo=formengine workflow=publish-npm-from-draft.yml
# See formengine-tools/scripts/release/npm-trusted-publishing.md

name: Publish npm from draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Draft release tag (lerna version, e.g. 11.0.0)
        required: true
        type: string
      npm_tag:
        description: npm dist-tag
        required: false
        default: latest
        type: string

permissions:
  # write required so GITHUB_TOKEN can list draft releases (API omits drafts for read-only)
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish draft tarballs to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          # Do not set registry-url / NODE_AUTH_TOKEN — that disables OIDC trusted publishing.

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Download draft npm archives and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NPM_PUBLISH_TAG: ${{ inputs.npm_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -f scripts/release/publish-npm-from-draft.sh ]; then
            bash scripts/release/publish-npm-from-draft.sh
            exit 0
          fi

          # Fallback when mirror only has the workflow (drafts are untagged — download by untagged slug).
          echo "scripts/release/publish-npm-from-draft.sh missing; using inline publish"
          VERSION="${VERSION:?}"
          REPO="${GITHUB_REPOSITORY:?}"
          TAG="${NPM_PUBLISH_TAG:-latest}"
          PATTERN="react-form-builder-*-${VERSION}.tgz"
          mkdir -p .archives
          DRAFT_JSON="$(
            gh api "repos/${REPO}/releases" --paginate \
              --jq "[.[] | select(.draft==true and .tag_name==\"${VERSION}\")][0] | select(.!=null) | {id, html_url}"
          )"
          if [ -z "${DRAFT_JSON}" ] || [ "${DRAFT_JSON}" = "null" ]; then
            echo "No draft release with tag_name=${VERSION} on ${REPO}" >&2
            exit 1
          fi
          DOWNLOAD_REF="$(printf '%s' "${DRAFT_JSON}" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const u=JSON.parse(d).html_url;console.log(u.split("/").pop())})')"
          RELEASE_ID="$(printf '%s' "${DRAFT_JSON}" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>console.log(JSON.parse(d).id))')"
          echo "==> Download ${PATTERN} (draft id=${RELEASE_ID}, ref=${DOWNLOAD_REF})"
          gh release download "${DOWNLOAD_REF}" \
            --repo "${REPO}" \
            --pattern "${PATTERN}" \
            --dir .archives \
            --clobber
          shopt -s nullglob
          archives=(.archives/react-form-builder-*-"${VERSION}".tgz)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No archives matching ${PATTERN}" >&2
            exit 1
          fi
          for tarball in "${archives[@]}"; do
            name_version="$(tar -xOf "${tarball}" package/package.json | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{const j=JSON.parse(d);console.log(`${j.name}@${j.version}`)})')"
            echo "==> npm publish ${tarball} (${name_version})"
            if npm view "${name_version}" version >/dev/null 2>&1; then
              echo "Already published ${name_version} — skipping"
              continue
            fi
            # OIDC may stage a version before npm view sees it; republish then hits E409.
            log="$(mktemp)"
            if npm publish "${tarball}" --access public --tag "${TAG}" >"${log}" 2>&1; then
              cat "${log}"
              rm -f "${log}"
            elif grep -qE 'npm error code E409|Cannot publish over previously staged version|cannot publish over existing version' "${log}"; then
              echo "Already staged/published ${name_version} — skipping"
              rm -f "${log}"
            else
              cat "${log}" >&2
              rm -f "${log}"
              exit 1
            fi
          done
